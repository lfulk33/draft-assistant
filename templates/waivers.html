<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Waiver Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    .waivers-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .waivers-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .waivers-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      margin: 0;
    }

    .waivers-sub {
      color: var(--gray-600);
      font-size: 13px;
      margin-bottom: 28px;
    }

    #btn-refresh {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 6px;
      border: 1px solid var(--gray-200);
      background: var(--white, #fff);
      cursor: pointer;
    }

    #btn-refresh:disabled {
      color: var(--gray-400);
      cursor: default;
    }

    .league-card {
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      background: var(--white, #fff);
      padding: 20px 22px;
      margin-bottom: 18px;
    }

    .league-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      margin: 0 0 10px;
    }

    .league-card .report-body {
      font-size: 14px;
      line-height: 1.6;
      color: #222;
      white-space: pre-wrap;
    }

    .league-card .error-body {
      font-size: 13px;
      color: #b3261e;
    }

    .loading-note,
    .empty-note {
      color: var(--gray-600);
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>

<body>
  <div class="waivers-wrap">
    <div class="waivers-header">
      <h1>Waiver Report</h1>
      <button id="btn-refresh">Run Report</button>
    </div>
    <div class="waivers-sub" id="waivers-sub">Not run yet this session.</div>
    <div id="waivers-content"></div>
  </div>

  <script>
    const btn = document.getElementById('btn-refresh');
    const sub = document.getElementById('waivers-sub');
    const content = document.getElementById('waivers-content');

    function renderReports(data) {
      content.innerHTML = '';
      if (!data.reports || !data.reports.length) {
        content.innerHTML = '<div class="empty-note">No leagues returned.</div>';
        return;
      }
      data.reports.forEach(r => {
        const card = document.createElement('div');
        card.className = 'league-card';
        if (r.error) {
          card.innerHTML = `<h2>${r.league_name}</h2><div class="error-body">${r.error}</div>`;
        } else {
          card.innerHTML = `<h2>${r.league_name}</h2><div class="report-body"></div>`;
          card.querySelector('.report-body').textContent = r.report;
        }
        content.appendChild(card);
      });
    }

    async function runReport() {
      btn.disabled = true;
      btn.textContent = 'Running… (this can take a minute)';
      content.innerHTML = '<div class="loading-note">Scouting waivers across all leagues — running live web research per league, please wait…</div>';
      try {
        const params = new URLSearchParams(window.location.search);
        const username = params.get('username') || '';
        const url = '/api/waiver-report' + (username ? `?username=${encodeURIComponent(username)}` : '');
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) {
          content.innerHTML = `<div class="empty-note">Error: ${data.error || 'unknown error'}</div>`;
          return;
        }
        sub.textContent = 'Generated ' + new Date(data.generated_at).toLocaleString();
        renderReports(data);
      } catch (e) {
        content.innerHTML = `<div class="empty-note">Request failed: ${e}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Report';
      }
    }

    btn.addEventListener('click', runReport);
  </script>
</body>

</html>
